[workspace]
resolver = "2"
members = [
    "crates/chess-core",
    "crates/chesskom-render",
    "crates/chesskom-cli",
    "crates/chesskom-ui",
    "crates/chesskom-kobo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/justinwash/chesskom"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
